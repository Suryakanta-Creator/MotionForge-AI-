name: MotionForge motion graphics checks
on:
  push:
    branches: [main]
    paths:
      - "motion_graphics.py"
      - "server.py"
      - "tests/test_motion_graphics.py"
      - ".github/workflows/motion-graphics-tests.yml"
  pull_request:
    paths:
      - "motion_graphics.py"
      - "server.py"
      - "tests/test_motion_graphics.py"
jobs:
  unit-and-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile motion_graphics.py server.py
      - run: MOTIONFORGE_SMOKE_RENDER=1 python -m unittest discover -s tests -p "test_motion_graphics.py" -v
