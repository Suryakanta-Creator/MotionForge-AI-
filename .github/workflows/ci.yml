name: MotionForge smoke tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg availability
        run: ffmpeg -version | head -n 1
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Compile Python source
        run: python -m compileall -q server.py autonomous.py ai_providers.py veo_video.py motion_engine.py tests/
      - name: Test upload, plan, render and MP4 export
        run: PYTHONPATH=. pytest -q tests/
